# Static-site server. TLS terminates upstream (Cloudflare tunnel -> kamal-proxy),
# so this only ever serves plain HTTP on :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Cache fingerprint-free media aggressively; it's fine for a personal site
    # and cheap to bust by re-deploying with changed files.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML should always revalidate so content edits show up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
